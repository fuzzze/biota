<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Biota</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="%BASE_URL%favicon.svg" alt="" />
          <span class="brand-name">BIOTA</span>
        </div>
        <p class="brand-sub">червяки какие-то</p>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-tab="encrypt">Зашифровать</button>
        <button class="tab" data-tab="decrypt">Расшифровать</button>
      </nav>

      <!-- ENCRYPT -->
      <section class="panel is-active" id="panel-encrypt">
        <label class="field-label" for="enc-text">Сообщение</label>
        <textarea id="enc-text" class="textarea" rows="4" placeholder="Введите текст для кодирования…"></textarea>

        <label class="field-label">Пропорции картинки</label>
        <div class="segmented" id="aspect">
          <button class="seg" data-aspect="vertical">Вертикальная</button>
          <button class="seg is-active" data-aspect="square">Квадратная</button>
          <button class="seg" data-aspect="horizontal">Горизонтальная</button>
        </div>

        <label class="field-label" for="enc-secret">Пароль (но можно и без него)</label>
        <div class="password">
          <input id="enc-secret" class="input" type="password" placeholder="секретная фраза" autocomplete="off" spellcheck="false" />
          <button class="eye" id="enc-eye" type="button" aria-label="Показать пароль"></button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btn-encode">Закодировать</button>
          <button class="btn btn-ghost" id="btn-clear">Очистить</button>
        </div>

        <div class="preview" id="preview-box">
          <span class="preview-empty" id="preview-empty">Предпросмотр узора появится здесь</span>
          <img class="preview-img" id="preview-img" alt="предпросмотр" />
        </div>

        <div class="statusbar">
          <span class="dims" id="enc-dims"></span>
          <button class="btn btn-save" id="btn-save" disabled>Сохранить файл</button>
        </div>
        <p class="status" id="enc-status"></p>
      </section>

      <!-- DECRYPT -->
      <section class="panel" id="panel-decrypt">
        <label class="field-label">Изображение</label>
        <div class="dropzone" id="dropzone">
          <input id="dec-file" type="file" accept="image/png,image/*" hidden />
          <img class="drop-thumb" id="drop-thumb" alt="" />
          <div class="drop-text" id="drop-text">
            <span class="drop-title">Перетащите PNG сюда</span>
            <span class="drop-sub">или нажмите, чтобы выбрать файл</span>
          </div>
        </div>

        <label class="field-label" for="dec-secret">Пароль (но можно и без него)</label>
        <div class="password">
          <input id="dec-secret" class="input" type="password" placeholder="секретная фраза" autocomplete="off" spellcheck="false" />
          <button class="eye" id="dec-eye" type="button" aria-label="Показать пароль"></button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btn-decode">Расшифровать</button>
        </div>

        <label class="field-label" for="dec-output">Расшифрованное сообщение</label>
        <textarea id="dec-output" class="textarea" rows="5" readonly placeholder="результат появится здесь…"></textarea>
        <p class="status" id="dec-status"></p>
      </section>

      <div class="loading" id="loading">загрузка тайлов…</div>
    </main>
  </body>
</html>
