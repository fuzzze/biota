<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />

    <!-- PWA: installable + offline. Manifest link is injected by vite-plugin-pwa. -->
    <meta name="theme-color" content="#0e1013" />
    <meta name="description" content="Кодирование текста в повороты шестиугольных тайлов. Работает офлайн, ничего не уходит на сервер." />

    <!-- iOS standalone install (Safari ignores the web manifest for these). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Biota" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <title>Biota</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">BIOTA</span>
        </div>
        <p class="brand-sub">червяки какие-то</p>
      </header>

      <nav class="tabs" id="tabs">
        <button class="tab is-active" data-tab="encrypt">Зашифровать</button>
        <button class="tab" data-tab="decrypt">Расшифровать</button>
      </nav>

      <!-- ENCRYPT -->
      <section class="panel is-active" id="panel-encrypt">
        <textarea id="enc-text" class="textarea" rows="4" placeholder="Текст сообщения"></textarea>

        <div class="password">
          <input id="enc-secret" class="input" type="password" placeholder="Пароль (но можно и без него)" autocomplete="off" spellcheck="false" />
          <button class="eye" id="enc-eye" type="button" aria-label="Показать пароль"></button>
        </div>

        <div class="actions">
          <div class="aspect" id="aspect" role="radiogroup" aria-label="Пропорции картинки">
            <button class="aspect-opt is-active" data-aspect="square"     type="button" role="radio" aria-checked="true"  aria-label="1:1"><span class="aspect-icon aspect-icon--square"></span></button>
            <button class="aspect-opt"           data-aspect="vertical"   type="button" role="radio" aria-checked="false" aria-label="2:3"><span class="aspect-icon aspect-icon--portrait"></span></button>
            <button class="aspect-opt"           data-aspect="horizontal" type="button" role="radio" aria-checked="false" aria-label="3:2"><span class="aspect-icon aspect-icon--landscape"></span></button>
          </div>
          <button class="btn btn-primary" id="btn-encode">Зашифровать</button>
          <button class="btn btn-icon" id="btn-clear" type="button" aria-label="Очистить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          </button>
        </div>

        <div class="preview" id="preview-box">
          <img class="preview-img" id="preview-img" alt="" />
        </div>

        <div class="statusbar">
          <span class="dims" id="enc-dims"></span>
          <button class="btn btn-save" id="btn-save" hidden>Сохранить файл</button>
        </div>
        <p class="status" id="enc-status"></p>
      </section>

      <!-- DECRYPT -->
      <section class="panel" id="panel-decrypt">
        <div class="dropzone" id="dropzone">
          <input id="dec-file" type="file" accept="image/png,image/*" hidden />
          <img class="drop-thumb" id="drop-thumb" alt="" />
          <div class="drop-text" id="drop-text">
            <span class="drop-title">Перетащите PNG сюда</span>
            <span class="drop-sub">или нажмите, чтобы выбрать файл</span>
          </div>
        </div>

        <div class="password">
          <input id="dec-secret" class="input" type="password" placeholder="Пароль (но можно и без него)" autocomplete="off" spellcheck="false" />
          <button class="eye" id="dec-eye" type="button" aria-label="Показать пароль"></button>
        </div>

        <div class="actions">
          <button class="btn btn-primary" id="btn-decode">Расшифровать</button>
        </div>

        <textarea id="dec-output" class="textarea" rows="5" readonly placeholder="Расшифрованное сообщение"></textarea>
        <p class="status" id="dec-status"></p>
      </section>

      <div class="loading" id="loading">загрузка тайлов…</div>
    </main>
  </body>
</html>
